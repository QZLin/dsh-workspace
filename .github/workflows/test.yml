name: Test workspace IPC

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: cli/go.sum
      - run: npm run check
      - run: npm test
      - run: go -C cli test -race ./...
      - run: npm run build:cli
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-workspace-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/
