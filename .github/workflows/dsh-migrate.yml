name: dsh-migrate

on:
  schedule:
    # 03:00 UTC / 11:00 Asia/Shanghai.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dsh_release:
        description: 'DSH version or dsh-v* tag (empty = latest, including prereleases)'
        required: false
        type: string
      migrate_again:
        description: 'Recheck the current version; never downgrade or use LLM repair'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/dsh-migrate.yml
      - .github/dsh-migrate.yml
      - scripts/dsh-migrate.mjs
      - scripts/check-dsh-host.mjs
      - test/dsh-migrate.test.mjs

# Checks never receive a write-enabled checkout credential.
permissions:
  contents: read

concurrency:
  group: dsh-migrate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      changed: ${{ steps.prepare.outputs.changed }}
      target_version: ${{ steps.prepare.outputs.target_version }}
      manifest_sha: ${{ steps.prepare.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - id: base
        name: Record the exact source commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: prepare
        name: Prepare the mechanical compatibility upgrade
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DSH_MIGRATE_TARGET: ${{ inputs.dsh_release || 'latest' }}
          DSH_MIGRATE_FORCE: ${{ inputs.migrate_again || false }}
        run: node scripts/dsh-migrate.mjs

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.prepare.outputs.should_check == 'true'
        with:
          go-version: stable
          cache-dependency-path: cli/go.sum

      - name: Test and build the independent native CLI
        if: steps.prepare.outputs.should_check == 'true'
        run: |
          go -C cli test ./...
          mkdir -p .tmp
          CGO_ENABLED=0 go -C cli build -o ../.tmp/dsh-workspace-probe .

      - id: check
        name: Check the plugin on the target DSH (no LLM)
        if: steps.prepare.outputs.should_check == 'true'
        uses: royenheart/dsh-migrate-bot@13f4999af2abe81d1e360d74739a6ae2b97def99 # v1.0.0-rc.4
        with:
          command: check
          target: ${{ steps.prepare.outputs.target_tag }}
          config: .github/dsh-migrate.yml
          skip_github: 'true'

      - id: host
        name: Check the real Web Host profile and native IPC (no LLM)
        if: steps.prepare.outputs.should_check == 'true'
        env:
          TARGET_VERSION: ${{ steps.prepare.outputs.target_version }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --workdir /github/workspace \
            --env DSH_MIGRATE_CLI=/github/workspace/scripts/check-dsh-host.mjs \
            ghcr.io/royenheart/dsh-migrate-bot:v1.0.0-rc.4 "$TARGET_VERSION"

      - name: Ensure checks did not modify the candidate manifest
        if: steps.prepare.outputs.should_check == 'true'
        env:
          EXPECTED_SHA: ${{ steps.prepare.outputs.manifest_sha }}
        run: printf '%s  package.json\n' "$EXPECTED_SHA" | sha256sum --check --strict

      - name: Keep the verified manifest for the write-only publication job
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-dsh-manifest
          path: package.json
          if-no-files-found: error
          retention-days: 1

      - name: Keep check diagnostics, including failures
        if: always() && steps.check.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-check-logs
          path: .dsh-migrate/runs/**/checks/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.base_sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-dsh-manifest
          path: .tmp/dsh-migrate-verified

      - name: Publish only the verified compatibility change
        env:
          TARGET_VERSION: ${{ needs.verify.outputs.target_version }}
          EXPECTED_SHA: ${{ needs.verify.outputs.manifest_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          printf '%s  .tmp/dsh-migrate-verified/package.json\n' "$EXPECTED_SHA" | sha256sum --check --strict
          cp .tmp/dsh-migrate-verified/package.json package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json
          git commit -m "chore: support dsh $TARGET_VERSION (no LLM)"
          # A concurrent main update is rejected, never overwritten or rebased without checks.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          printf '\n## Published\n\nVerified DSH `%s` compatibility was committed to `%s`.\n' "$TARGET_VERSION" "$DEFAULT_BRANCH" >> "$GITHUB_STEP_SUMMARY"
