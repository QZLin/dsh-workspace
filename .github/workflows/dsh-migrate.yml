name: dsh-migrate

# Mirrors QZLin/dsh-migrate-bot's reusable workflow at v3, with two differences:
# the schedule is disabled, and Go is set up before the Action because the
# configured checks build and test cli/. Everything else the Action needs at
# runtime is installed by the Action itself.
#
# The migration configuration is inline: the step below writes a scratch file and
# hands its path to the Action, so the repository keeps no separate config file.
on:
  # schedule:
    # 03:00 UTC / 11:00 Asia/Shanghai.
    # - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dsh_release:
        description: 'DSH version or dsh-v* tag (empty = latest)'
        required: false
        type: string
      bump_again:
        description: 'Run this release again unless its proposal is still open'
        required: false
        type: boolean
        default: false

# v3 records migration state and publishes proposal branches, issues, and PRs.
permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: dsh-migrate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # The inline configuration lives under .tmp/, which is git-ignored, so v3
      # never stages it into the proposal branch.
      - name: Write the inline migration configuration
        run: |
          mkdir -p .tmp
          cat > .tmp/dsh-migrate-config.yml <<'YAML'
          target: latest

          bump:
            # A compatibility proposal must not silently publish a new release.
            ownVersion: false

          # These commands replace v3's built-in mechanical suite and run in the
          # plugin root; the first failure stops the migration.
          tests:
            commands:
              - npm run check
              - npm test
              - go -C cli test ./...
              - mkdir -p .tmp && CGO_ENABLED=0 go -C cli build -o ../.tmp/dsh-workspace-probe .
              - node scripts/check-dsh-host.mjs

          checks:
            # The built-in headless profile has no workspaceRegistry. The probe
            # above boots the real Web composition and pings the native CLI.
            boot:
              enabled: false
            # This Host-only plugin has no dsh.client surface; the probe above
            # covers it instead.
            web:
              enabled: false

          timeouts:
            commandMs: 900000
          YAML
          test -s .tmp/dsh-migrate-config.yml

      # The configured mechanical suite tests and builds the independent native CLI.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: cli/go.sum

      - id: migrate
        name: Bump, check, and propose DSH compatibility (no LLM)
        uses: QZLin/dsh-migrate-bot@v3 # v3 / v3.0.3
        with:
          command: bump
          target: ${{ inputs.dsh_release || '' }}
          force: ${{ inputs.bump_again || false }}
          config: .tmp/dsh-migrate-config.yml

      - name: Keep full check diagnostics, including failures
        if: always() && steps.migrate.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-migrate-check-logs
          path: .dsh-migrate/runs/**/checks/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7