name: dsh-migrate

# QZLin/dsh-migrate-bot v3: bump the DSH ranges, run our checks, propose the
# result. Two differences from v3's reusable workflow: the schedule is disabled
# here, and Go is installed before the Action because the checks build and test
# cli/. The Action installs everything else it needs on the runner.
#
# The migration configuration is inline: v3 takes a file path, so the step below
# writes it under the git-ignored .tmp/ and hands that path over.
on:
  # schedule:
    # 03:00 UTC / 11:00 Asia/Shanghai.
    # - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dsh_release:
        description: 'DSH version or dsh-v* tag (empty = latest)'
        required: false
        type: string
      bump_again:
        description: 'Run this release again unless its proposal is still open'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: dsh-migrate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Write the migration configuration
        run: |
          mkdir -p .tmp
          cat > .tmp/dsh-migrate-config.yml <<'YAML'
          target: latest
          bump:
            ownVersion: false
          tests:
            commands:
              - npm run check
              - npm test
              - go -C cli test ./...
              - CGO_ENABLED=0 go -C cli build -o ../.tmp/dsh-workspace-probe .
              - node scripts/check-dsh-host.mjs
          checks:
            boot:
              enabled: false
            web:
              enabled: false
          YAML

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: cli/go.sum

      - id: migrate
        name: Bump, check, and propose DSH compatibility (no LLM)
        uses: QZLin/dsh-migrate-bot@v3 # v3 / v3.0.3
        with:
          command: bump
          target: ${{ inputs.dsh_release || '' }}
          force: ${{ inputs.bump_again || false }}
          config: .tmp/dsh-migrate-config.yml

      - name: Keep check diagnostics, including failures
        if: always() && steps.migrate.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-migrate-check-logs
          path: .dsh-migrate/runs/**/checks/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7